# Automated NuGet Package Updates using dotnet-outdated-tool
#
# This workflow automatically checks for and updates outdated NuGet packages.
# Runs every Saturday at 9 AM UTC
#
# IMPORTANT - Central Package Management (CPM):
# This repository uses Directory.Packages.props for central package management.
# The workflow will:
# 1. Automatically detect and update Directory.Packages.props
# 2. Apply updates to ALL projects (since they share the same version file)
# 3. Create a PR with detailed update information
#
# This ensures version consistency across all projects in the repository.

name: Update NuGet Packages

on:
  schedule:
    - cron: '0 9 * * 6'  # Every Saturday at 9 AM UTC
  workflow_dispatch:      # Allow manual triggering

env:
  DOTNET_VERSION: '8.0.x'  # Match the project's .NET version
  # Options shared by every dotnet-outdated call - detection and upgrade MUST agree,
  # otherwise the bot proposes bumps it then refuses (or fails) to apply.
  #
  # --exclude Microsoft.CodeAnalysis.PublicApiAnalyzers: 5.x needs a newer Roslyn than
  #   the .NET 8 SDK ships -> CS9057. Unpin only when DOTNET_VERSION moves past 8.0.
  #   Note: --exclude matches by substring (case-insensitive), NOT by glob.
  # --version-lock Major: never bump a major automatically. Majors reshape package
  #   graphs (xunit.v3 4.0.0 moved to xunit.v3.mtp-v2) and broke restore with NU1107;
  #   they need a human. Minor/patch updates still flow.
  OUTDATED_OPTS: '--exclude Microsoft.CodeAnalysis.PublicApiAnalyzers --version-lock Major'

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-outdated-tool
        run: |
          dotnet tool install --global dotnet-outdated-tool || dotnet tool update --global dotnet-outdated-tool

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for outdated packages
        id: check-outdated
        run: |
          echo "Checking for outdated NuGet packages..."

          # Run dotnet-outdated and save output
          # Using --fail-on-updates to get exit code 2 when updates are available
          set +e  # Don't exit on non-zero return code
          OUTPUT=$(dotnet-outdated $OUTDATED_OPTS --fail-on-updates 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          # Save the output for later use in PR body
          echo "OUTDATED_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Exit code 2 means updates are available
          if [ $EXIT_CODE -eq 2 ]; then
            echo "✅ Updates available!"
            echo "updates_available=true" >> $GITHUB_OUTPUT

            # Extract package update information for PR body
            echo "$OUTPUT" | grep -E "^\s+\S+\s+\S+\s+->\s+\S+" > /tmp/updates.txt || true
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "ℹ️ No updates found - all packages are up to date"
            echo "updates_available=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Error checking for updates (exit code: $EXIT_CODE)"
            exit 1
          fi

      - name: Create update branch
        if: steps.check-outdated.outputs.updates_available == 'true'
        run: |
          BRANCH_NAME="nuget-updates-$(date +%Y%m%d)"

          # Fetch all branches to see what exists
          git fetch origin

          # Check if branch already exists on remote
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists on remote, checking it out..."
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"

            # Reset to main to start fresh with updates
            git reset --hard origin/main
          else
            echo "Creating new branch $BRANCH_NAME..."
            git checkout -b "$BRANCH_NAME"
          fi

          echo "branch=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Update packages
        if: steps.check-outdated.outputs.updates_available == 'true'
        id: update
        run: |
          # Update all outdated packages
          # dotnet-outdated will automatically detect and update Directory.Packages.props
          echo "Updating packages to latest versions..."

          PARTIAL=false

          # Outputs are written exactly once, on every exit path
          finish() {
            echo "partial_update=$PARTIAL" >> $GITHUB_OUTPUT
            echo "packages_updated=$1" >> $GITHUB_OUTPUT
          }

          # Restore and keep the log; inside $(...) a failure is invisible, so the
          # status must be captured explicitly
          try_restore() {
            set +e
            RESTORE_OUTPUT=$(dotnet restore 2>&1)
            RESTORE_STATUS=$?
            set -e
            [ $RESTORE_STATUS -eq 0 ]
          }

          # The branch was just reset to origin/main, so ANY tracked-file change is
          # the upgrade's doing. Whole-tree check, not just Directory.Packages.props:
          # dotnet-outdated also rewrites .csproj entries for packages outside CPM,
          # and those must be verified/rolled back too - never committed unchecked.
          nothing_changed() {
            git diff --quiet
          }

          # Undo everything the upgrade touched, byte-for-byte
          rollback() {
            git checkout -- .
          }

          # Try to upgrade packages, but continue even if some fail
          set +e
          dotnet-outdated $OUTDATED_OPTS --upgrade
          UPGRADE_EXIT_CODE=$?
          set -e

          if [ $UPGRADE_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Some packages may have failed to update, continuing with successfully updated packages..."
            PARTIAL=true
          fi

          # Not a failure: detection can see an update the upgrade step then
          # refuses to apply (excluded/pinned package, unrewritable entry).
          # Nothing changed -> nothing to verify, no PR; end the step cleanly.
          if nothing_changed; then
            echo "ℹ️ No packages were actually updated - nothing to commit"
            finish false
            exit 0
          fi

          echo "✅ Packages were successfully updated"

          # Restore to verify the updated packages work
          echo "Verifying package restore..."
          if ! try_restore; then
            # try_restore overwrites RESTORE_OUTPUT; keep the original failure so the
            # log still explains why the first attempt died after a retry runs
            FIRST_RESTORE_OUTPUT="$RESTORE_OUTPUT"
            echo "⚠️ Package restore failed after the upgrade:"
            echo "$FIRST_RESTORE_OUTPUT"

            # NU1107 is a version conflict, in practice always the xUnit family:
            # xunit.v3 and xunit.v3.extensibility.core are separate entries and
            # CentralPackageTransitivePinningEnabled makes a half-moved family
            # irreconcilable. Roll back and retry with the whole family excluded.
            # --exclude matches by substring, so plain "xunit" covers it; a glob
            # ("xunit*") matches nothing and silently re-applies the same bump.
            if grep -q "NU1107" <<< "$FIRST_RESTORE_OUTPUT"; then
              echo "Version conflict detected, retrying without xUnit packages..."
              rollback
              PARTIAL=true

              set +e
              dotnet-outdated $OUTDATED_OPTS --exclude xunit --upgrade
              set -e
            fi

            if nothing_changed; then
              echo "ℹ️ Nothing left to update after dropping the conflicting packages"
              finish false
              exit 0
            fi

            # Still broken: abandon the run rather than push a branch that cannot
            # restore. No PR, no red X on infrastructure that behaved correctly.
            if ! try_restore; then
              echo "$RESTORE_OUTPUT"
              echo "::warning::Package restore still fails after the retry - no PR will be opened"
              rollback
              finish false
              exit 0
            fi
          fi

          finish true

          # Quick build check to ensure packages are compatible
          echo "Quick build verification..."
          dotnet build --no-restore --configuration Release || {
            echo "⚠️ Build failed with updated packages - PR will show test failures"
            echo "build_failed=true" >> $GITHUB_OUTPUT
          }

          # Get the list of what was actually updated for the PR
          echo "Checking what was updated..."
          dotnet-outdated $OUTDATED_OPTS > /tmp/post-update-check.txt 2>&1 || true
          echo "POST_UPDATE_CHECK<<EOF" >> $GITHUB_ENV
          cat /tmp/post-update-check.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Configure Git
        if: steps.update.outputs.packages_updated == 'true'
        run: |
          git config user.name "NuGet Update Bot"
          git config user.email "nuget-bot@github-actions"

      - name: Commit changes
        # packages_updated implies updates_available; gating on it keeps the commit
        # out of every early exit of the update step (nothing applied / rolled back)
        if: steps.update.outputs.packages_updated == 'true'
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG="chore: update NuGet packages

          Automated NuGet package updates by NugetUpdateBot

          Generated on: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git commit -m "$COMMIT_MSG"

            # Force push to handle cases where branch already exists
            # This is safe because this is an automated branch that gets replaced each run
            git push --force-with-lease origin "${{ env.branch }}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update.outputs.packages_updated == 'true' && steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Prepare status messages
          PARTIAL_WARNING=""
          BUILD_STATUS="✅ Build successful"

          if [ "${{ steps.update.outputs.partial_update }}" == "true" ]; then
            PARTIAL_WARNING="
          > ⚠️ **Note**: Some packages failed to update automatically. Manual intervention may be required.
          "
          fi

          if [ "${{ steps.update.outputs.build_failed }}" == "true" ]; then
            BUILD_STATUS="⚠️ Build failed - manual review required"
          fi

          # Create PR body with actual update details
          PR_BODY="## 🔄 NuGet Package Updates

          This PR contains automatic NuGet package updates generated by dotnet-outdated-tool.
          $PARTIAL_WARNING

          ### 📊 Initial Status
          - **Pre-flight Build**: $BUILD_STATUS
          - **Update Type**: $([ "${{ steps.update.outputs.partial_update }}" == "true" ] && echo "Partial (some packages skipped)" || echo "Complete")

          ### 📦 Package Updates

          **Before Update:**
          \`\`\`
          ${{ env.OUTDATED_OUTPUT }}
          \`\`\`

          **After Update:**
          \`\`\`
          ${{ env.POST_UPDATE_CHECK }}
          \`\`\`

          ### 🧪 Automated Testing
          The following checks will run automatically on this PR:
          - ✅ Build validation (Debug and Release modes)
          - ✅ Unit test execution with code coverage
          - ✅ Performance benchmarks
          - ✅ Security vulnerability scan

          **Check the PR checks below for detailed test results.**

          ### ✅ Manual Review Checklist
          Please verify before merging:
          - [ ] All automated tests pass
          - [ ] No breaking changes in public APIs
          - [ ] Package updates are compatible with the project
          - [ ] Performance hasn't degraded
          - [ ] No new security warnings

          ### 💡 Notes
          - Major-version bumps are never proposed automatically (\`--version-lock Major\`) - update them by hand
          - If xUnit packages were skipped due to version conflicts, consider updating them manually
          - Review the changes in \`Directory.Packages.props\` to ensure all versions are compatible
          - Check the Actions tab for detailed test logs and artifacts

          ### 📋 Metadata
          - **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Schedule**: Every Saturday at 9 AM UTC
          - **Branch**: \`${{ env.branch }}\`
          - **Tool**: [dotnet-outdated-tool](https://github.com/dotnet-outdated/dotnet-outdated)

          ---
          🤖 This PR was automatically created by GitHub Actions. Tests will run automatically."

          # A broken pre-flight build must never produce a mergeable PR
          DRAFT_FLAG=""
          if [ "${{ steps.update.outputs.build_failed }}" == "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          # Check if PR already exists for today
          EXISTING_PR=$(gh pr list --head "${{ env.branch }}" --json number --jq '.[0].number' || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists (#$EXISTING_PR), updating it..."
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
            if [ -n "$DRAFT_FLAG" ]; then
              gh pr ready "$EXISTING_PR" --undo
            fi
          else
            gh pr create \
              --title "🔄 Update NuGet Packages ($(date +%Y-%m-%d))" \
              --body "$PR_BODY" \
              --base main \
              --head "${{ env.branch }}" \
              $DRAFT_FLAG
          fi

      - name: No updates needed
        if: steps.check-outdated.outputs.updates_available == 'false'
        run: |
          echo "✅ All packages are up to date!"

      - name: Fail the run if the pre-flight build broke
        # The build check above only annotated the PR body; without this the job stayed
        # green and a non-compiling bump could be merged (see LoadSurge PR #27).
        if: steps.update.outputs.build_failed == 'true'
        run: |
          echo "::error::Pre-flight build failed with the updated packages. The PR was opened as a draft."
          exit 1
