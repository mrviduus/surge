name: LoadSurge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # release tags trigger the publish job
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for versioning

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Display .NET info
      run: dotnet --info

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore --verbosity normal

    - name: Build solution
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore --verbosity normal

    - name: Run unit tests
      run: |
        dotnet test \
          --solution LoadSurge.sln \
          --configuration ${{ matrix.configuration }} \
          --no-build \
          --output Detailed \
          --report-trx \
          --coverage \
          --coverage-output-format cobertura \
          --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.configuration }}
        path: TestResults/

    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      if: matrix.configuration == 'Release'
      with:
        files: TestResults/*.cobertura.xml
        fail_ci_if_error: false
        verbose: true

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') || startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      id-token: write   # OIDC token for NuGet Trusted Publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Extract version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          # Base version from the csproj; run number appended as the 4th part
          BASE_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/LoadSurge/LoadSurge.csproj)
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version set to: $VERSION"

    - name: Update .csproj with Version
      run: |
        # Only the version is stamped; PackageReleaseNotes stays canonical from the csproj
        sed -i 's|<Version>.*</Version>|<Version>${{ env.VERSION }}</Version>|' src/LoadSurge/LoadSurge.csproj
        echo "Updated version in .csproj to: ${{ env.VERSION }}"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build release
      run: dotnet build --configuration Release --no-restore

    - name: Create NuGet package
      run: dotnet pack src/LoadSurge --configuration Release --no-build --output ./artifacts

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

    # Trusted Publishing (OIDC) - no long-lived API key. The nuget.org policy is bound to
    # owner=mrviduus, repo=LoadSurge, workflow=ci-cd.yml: renaming this file breaks publishing.
    # The temporary key lives 1 hour, so login must stay adjacent to the push step.
    - name: NuGet login (OIDC -> temporary API key)
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: mrviduus

    - name: Publish to NuGet (on tag or main branch)
      # Continuous delivery: a tag publishes its exact version, a main push publishes
      # <csproj version>.<run number>. Bot commits from auto-nuget-update.yml push with
      # GITHUB_TOKEN, which does not re-trigger workflows, so dependency bumps never publish.
      if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Run security scan
      run: |
        dotnet list package --vulnerable --include-transitive || true
        dotnet list package --deprecated || true
